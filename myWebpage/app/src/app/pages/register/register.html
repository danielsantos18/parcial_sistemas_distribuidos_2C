<div class="auth-container">
  <div class="auth-card animate-fade">
    <h2>Create Account</h2>
    <p>Join Infernal Bank today</p>

    <form (ngSubmit)="onRegister()">
      <div class="input-group">
        <input type="text" [(ngModel)]="name" name="name" placeholder="Name" required />
      </div>
      <div class="input-group">
        <input type="text" [(ngModel)]="lastName" name="lastName" placeholder="Last Name" required />
      </div>
      <div class="input-group">
        <input type="email" [(ngModel)]="email" name="email" placeholder="Email" required />
      </div>
      <div class="input-group">
        <input type="password" [(ngModel)]="password" name="password" placeholder="Password" required />
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Registering...' : 'Register' }}
      </button>
    </form>

    <p class="register-link">
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>
  </div>
</div>
