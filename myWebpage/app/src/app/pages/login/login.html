<div class="auth-wrap">
  <div class="card">
    <h2>Iniciar sesión</h2>
    <label>Email
      <input type="email" [(ngModel)]="email" />
    </label>
    <label>Contraseña
      <input type="password" [(ngModel)]="password" />
    </label>
    <button (click)="submit()" [disabled]="loading">Entrar</button>
    <p class="note">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
  </div>
</div>
