<app-navbar></app-navbar>

<header class="hero fade-in">
  <div class="content">
    <h1>Pagos inteligentes en tiempo real</h1>
    <p>Con InfernoBank, administra tus servicios y realiza pagos seguros y veloces.</p>
  </div>
</header>

<div class="home-container glass fade-in">
  <h1>Bienvenido a tu banca digital</h1>

  <!-- Botones principales -->
  <div class="quick-actions">
    <button class="btn-primary" (click)="goTo('/catalog')">💡 Pagar Servicios</button>
    <button class="btn-primary" (click)="goTo('/cards')">💳 Pagar Tarjeta</button>
  </div>

  <!-- Transferencias recientes -->
  <section class="recent-transfers glass">
    <h2>Transferencias recientes</h2>
    <ul>
      <li *ngFor="let t of recentTransfers">
        <span class="who">{{ t.destinatario }}</span>
        <span class="amount">{{ t.monto | currency:'COP' }}</span>
        <span class="date">{{ t.fecha }}</span>
      </li>
    </ul>
    <div class="see-more">
      <a routerLink="/payments">Ver todas</a>
    </div>
  </section>
</div>
