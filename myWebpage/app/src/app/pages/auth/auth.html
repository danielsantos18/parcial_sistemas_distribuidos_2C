<div class="auth-wrapper" [class.right-panel-active]="isSignUp">
  <div class="form-container sign-up-container">
    <form (ngSubmit)="onRegister()">
      <h1>Create Account</h1>
      <span>Use your email for registration</span>
      <input type="text" [(ngModel)]="name" name="name" placeholder="First Name" required />
      <input type="text" [(ngModel)]="lastName" name="lastName" placeholder="Last Name" required />
      <input type="email" [(ngModel)]="regEmail" name="regEmail" placeholder="Email" required />
      <input type="password" [(ngModel)]="regPassword" name="regPassword" placeholder="Password" required />
      <button type="submit" [disabled]="loading">{{ loading ? 'Registering...' : 'Sign Up' }}</button>
    </form>
  </div>

  <div class="form-container sign-in-container">
    <form (ngSubmit)="onLogin()">
      <h1>Sign in</h1>
      <span>Use your account</span>
      <input type="email" [(ngModel)]="email" name="email" placeholder="Email" required />
      <input type="password" [(ngModel)]="password" name="password" placeholder="Password" required />
      <button type="submit" [disabled]="loading">{{ loading ? 'Logging in...' : 'Sign In' }}</button>
    </form>
  </div>

  <div class="overlay-container">
    <div class="overlay">
      <div class="overlay-panel overlay-left">
        <h1>Welcome Back!</h1>
        <p>To keep connected with us please login with your personal info</p>
        <button class="ghost" (click)="toggleForm()">Sign In</button>
      </div>
      <div class="overlay-panel overlay-right">
        <h1>Hello, Friend!</h1>
        <p>Enter your personal details and start your journey with us</p>
        <button class="ghost" (click)="toggleForm()">Sign Up</button>
      </div>
    </div>
  </div>
</div>
