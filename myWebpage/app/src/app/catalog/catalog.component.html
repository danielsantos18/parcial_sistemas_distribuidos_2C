<app-navbar></app-navbar>

<div class="catalog-container glass fade-in">
  <h2>Catálogo de Servicios</h2>

  <!-- Buscador -->
  <mat-form-field appearance="outline" class="search-input">
    <mat-label>Buscar servicio</mat-label>
    <input matInput [(ngModel)]="searchTerm" (input)="filterCatalog()" placeholder="Ej: Internet, Energía, TV">
  </mat-form-field>

  <!-- Loader -->
  <ng-container *ngIf="isLoading; else contentTpl">
    <div class="loading">
      <mat-spinner></mat-spinner>
      <p>Cargando catálogo...</p>
    </div>
  </ng-container>

  <ng-template #contentTpl>
    <div *ngIf="errorMessage" class="error-message glass">{{ errorMessage }}</div>

    <!-- Vista en cards -->
    <div class="cards-grid" *ngIf="filteredData.length > 0; else noDataTpl">
      <div class="service-card glass fade-in" *ngFor="let item of filteredData">
        <h3>{{ item.name || item.servicio }}</h3>
        <p class="desc">{{ item.description || item.detalles }}</p>
        <p class="price">{{ (item.price ?? item.precio_mensual) | currency:'COP' }}</p>
        <div class="actions">
          <button mat-raised-button color="primary" (click)="pay(item)">Pagar</button>
          <button mat-stroked-button color="accent" (click)="viewDetails(item)">Detalles</button>
        </div>
      </div>
    </div>

    <ng-template #noDataTpl>
      <div class="no-data glass">No hay servicios disponibles.</div>
    </ng-template>
  </ng-template>
</div>
